[project]
name = "airgrove"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter handles length; long strings are fine

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
